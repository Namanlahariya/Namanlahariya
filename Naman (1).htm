<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch My Heart 💖</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: Arial, sans-serif;
            color: #4a4a4a;
            text-align: center;
            overflow: hidden;
        }
        .container {
            max-width: 500px;
            padding: 40px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #e91e63;
            font-size: 2.5em;
        }
        p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .button {
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: #fff;
            transition: 0.3s ease;
        }
        .yes {
            background-color: #e91e63;
            position: absolute;
        }
        .no {
            background-color: #607d8b;
        }
        .yes:hover {
            background-color: #d81b60;
        }
        .no:hover {
            background-color: #78909c;
        }
        #responseMessage {
            display: none;
            margin-top: 20px;
            font-size: 1.2em;
            color: #4caf50;
        }
        .contact-button {
            display: none;
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1em;
            color: #fff;
            background-color: #e91e63;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s ease;
        }
        .contact-button:hover {
            background-color: #d81b60;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will You Catch My Heart? 💖</h1>
        <p>I'm really hoping you'll say yes... but only if you can catch it! 😊</p>
        <div class="buttons">
            <button class="button yes" id="yesButton" onclick="showResponse('yes')">Yes 💕</button>
            <button class="button no" onclick="showResponse('no')">No 😢</button>
        </div>
        <p id="responseMessage"></p>
        <a href="https://wa.me/qr/B3ZPDDUIXNMDD1" id="contactButton" class="contact-button">Get in Touch 💌</a>
    </div>

    <script>
        const yesButton = document.getElementById("yesButton");

      
        yesButton.addEventListener("mouseover", function() {
            yesButton.style.top = Math.random() * 80 + "vh";
            yesButton.style.left = Math.random() * 80 + "vw";
        });

        function showResponse(answer) {
            const responseMessage = document.getElementById("responseMessage");
            const contactButton = document.getElementById("contactButton");

            if (answer === 'yes') {
                responseMessage.innerText = "Yay! You caught my heart! 💖 Can’t wait to start this journey together.";
                contactButton.style.display = "inline-block";  // Show contact button on "Yes"
            } else {
                responseMessage.innerText = "That’s okay! 😊 Thanks for being honest, and let’s keep being friends!";
                contactButton.style.display = "none";  // Hide contact button on "No"
            }
            responseMessage.style.display = "block";
        }
    </script>
</body>
</html>
